name: Profile activity

# Rebuilds the README's activity tiles (contributions graph, streaks, PR/commit/issue/review
# counts, top languages) plus the contribution snake, and publishes them to the `output` branch.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/activity.mjs
      - .github/workflows/profile-activity.yml
      - assets/readme/fonts/**

permissions:
  contents: write # only to push the generated files to the output branch

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate activity tiles
        run: node .github/scripts/activity.mjs dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile activity"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
